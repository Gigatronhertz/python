<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PyWeb — Python in your browser</title>
    <meta
      name="description"
      content="A real Python interpreter that runs entirely in your browser. Autocomplete, auto-indent, while loops and interactive input() — no server, no install."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%90%8D%3C/text%3E%3C/svg%3E" />
    <script type="module" crossorigin src="/assets/index-gYA_-IpK.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BqrsVwGI.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">&gt;_</span>
        <span class="name">PyWeb</span>
        <span class="tagline">Python, entirely in your browser</span>
      </div>

      <div class="controls">
        <select id="examples" title="Load an example">
          <option value="">Examples…</option>
        </select>
        <button id="clear" class="btn ghost" title="Clear terminal (Ctrl+L)">Clear</button>
        <button id="stop" class="btn danger" title="Stop (or Ctrl+C in the terminal)">
          <span class="glyph">■</span> Stop
        </button>
        <button id="run" class="btn primary" title="Run (Ctrl+Enter)">
          <span class="glyph">▶</span> Run
        </button>
      </div>
    </header>

    <p id="warning" class="warning" hidden></p>

    <main id="panes" class="panes">
      <section class="pane editor-pane">
        <div class="pane-head">
          <span class="pane-title">main.py</span>
          <span class="hint">Ctrl+Space autocomplete · Tab indent · Ctrl+Enter run</span>
        </div>
        <div id="editor" class="pane-body"></div>
      </section>

      <div id="splitter" class="splitter" role="separator" aria-orientation="vertical"></div>

      <section class="pane terminal-pane">
        <div class="pane-head">
          <span class="pane-title">Terminal</span>
          <span class="hint">input() is typed right here</span>
        </div>
        <div id="terminal" class="pane-body terminal-body"></div>
      </section>
    </main>

    <footer class="statusbar">
      <span id="status" class="status" data-kind="loading">
        <span class="dot"></span><span id="status-text">Loading…</span>
      </span>
      <span class="spacer"></span>
      <span id="version" class="muted"></span>
      <span class="muted">Runs 100% on your device — nothing is uploaded.</span>
    </footer>

  </body>
</html>
